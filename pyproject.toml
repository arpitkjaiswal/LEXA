[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "buddy-desktop"
version = "0.2.0"
description = "A native Apple Silicon desktop pet with local voice recognition and allowlisted laptop skills."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "httpx>=0.27,<1",
  "anthropic>=0.45,<1",
  "openai>=1.66,<3",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
voice = [
  "faster-whisper>=1.1,<2",
  "av==18.1.0", # faster-whisper uses metadata_errors, removed by PyAV 19
  "sounddevice>=0.5,<1",
  "numpy>=1.26,<3",
  "edge-tts>=7,<8",
  "pyttsx3>=2.98,<3",
  "pynput>=1.7,<2",
]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]
desktop = ["PySide6-Essentials==6.11.3"]
wake = [
  "openwakeword>=0.6,<0.7",
  "onnxruntime>=1.18,<2",
  "scipy>=1.12,<2",
  "sounddevice>=0.5,<1",
  "ai-edge-litert==2.3.0; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
music = ["yt-dlp>=2025.1"]
package = ["pyinstaller>=6.11,<7", "pyinstaller-hooks-contrib>=2025.1"]

[project.scripts]
buddy = "buddy.main:main"
lexa = "buddy.main:main"

[tool.setuptools.packages.find]
include = ["buddy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
