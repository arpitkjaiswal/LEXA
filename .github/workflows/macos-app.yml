name: Build Apple Silicon app

on:
  push:
    branches: [main, codex/complete-macos-companion]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      MACOSX_DEPLOYMENT_TARGET: "15.2"
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - name: Isolate smoke-test data
        run: echo "BUDDY_DATA_DIR=$RUNNER_TEMP/buddy-build-smoke" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: arm64
          cache: pip
      - run: python -m pip install -e ".[voice,desktop,wake,music,package]"
      - run: python -m PyInstaller --clean --noconfirm packaging/BUDDY.spec
      - name: Audit every bundled Mach-O for arm64 and macOS 15.2 compatibility
        run: python -m buddy.build_tools.verify_macos dist/BUDDY.app --output dist/AppleSilicon-compatibility.json
      - name: Check the frozen app without a mic or API
        run: dist/BUDDY.app/Contents/MacOS/BUDDY --demo --no-tts --once "Hello BUDDY"
      - name: Check the frozen local Whisper worker without a microphone
        run: dist/BUDDY.app/Contents/MacOS/BUDDY --voice-smoke-test
      - name: Check the frozen desktop and clean worker shutdown
        run: dist/BUDDY.app/Contents/MacOS/BUDDY --desktop --demo --no-tts --desktop-smoke-test
      - name: Create Apple Silicon ZIP and drag-to-install DMG
        run: |
          ditto -c -k --sequesterRsrc --keepParent dist/BUDDY.app dist/BUDDY-AppleSilicon.zip
          mkdir -p dist/dmg-root
          ditto dist/BUDDY.app dist/dmg-root/BUDDY.app
          ln -s /Applications dist/dmg-root/Applications
          hdiutil create -volname "BUDDY Apple Silicon" -srcfolder dist/dmg-root -ov -format UDZO dist/BUDDY-AppleSilicon.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: BUDDY-AppleSilicon-development
          path: |
            dist/BUDDY-AppleSilicon.zip
            dist/BUDDY-AppleSilicon.dmg
            dist/AppleSilicon-compatibility.json
          retention-days: 14

  newer-macos:
    name: Test the same ARM64 app on current macOS
    needs: package
    runs-on: macos-latest
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Isolate smoke-test data
        run: echo "BUDDY_DATA_DIR=$RUNNER_TEMP/buddy-newer-macos-smoke" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: BUDDY-AppleSilicon-development
      - run: ditto -x -k BUDDY-AppleSilicon.zip extracted
      - run: extracted/BUDDY.app/Contents/MacOS/BUDDY --demo --no-tts --once "Hello Apple Silicon"
      - run: extracted/BUDDY.app/Contents/MacOS/BUDDY --desktop --demo --no-tts --desktop-smoke-test
      - name: Check local Whisper in the same frozen app
        run: extracted/BUDDY.app/Contents/MacOS/BUDDY --voice-smoke-test
