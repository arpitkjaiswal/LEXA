name: Build macOS app

on:
  push:
    branches: [main, codex/complete-macos-companion]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[voice,desktop,wake,music,package]"
      - run: python -m PyInstaller --clean --noconfirm packaging/BUDDY.spec
      - name: Check the frozen app without a mic or API
        run: dist/BUDDY.app/Contents/MacOS/BUDDY --demo --no-tts --once "Hello BUDDY"
      - name: Archive the development app
        run: ditto -c -k --sequesterRsrc --keepParent dist/BUDDY.app dist/BUDDY-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BUDDY-${{ runner.arch }}-development
          path: dist/BUDDY-macos.zip
          retention-days: 14
